services:
  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: bash -lc "corepack enable && pnpm install && pnpm dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - gradientbattle-pnpm-store:/pnpm-store
    # Healthy only once `pnpm install` has finished and Next is serving — the
    # battle service waits on this so the two never run `pnpm install` at once.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  battle:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    # No `pnpm install` here — `web` owns the install; we wait for it to finish
    # (see depends_on below) so node_modules already has tsx + ws.
    command: bash -lc "corepack enable && pnpm --filter web battle"
    # Shares AUTH_SECRET with the web app — required to decrypt the session JWE.
    env_file:
      - apps/web/.env
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace
      - gradientbattle-pnpm-store:/pnpm-store
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gradientbattle
      POSTGRES_PASSWORD: gradientbattle
      POSTGRES_DB: gradientbattle
    ports:
      # 5433 on the host: a system Postgres already owns 5432 on this machine.
      # Inside the compose network other services still reach it as postgres:5432.
      - "5433:5432"
    volumes:
      - gradientbattle-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradientbattle -d gradientbattle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # persist data across restarts (append-only file)
    command: redis-server --appendonly yes
    volumes:
      - gradientbattle-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  gradientbattle-pnpm-store:
  gradientbattle-redis:
  gradientbattle-postgres:
