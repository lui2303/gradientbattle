name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight PR runs, but never cancel a main run mid-push — that
# could abort a half-uploaded image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    needs: build
    # Fork PRs get a read-only GITHUB_TOKEN and no secrets, so a push there
    # could never succeed. Skip rather than fail.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The repo default is read-only; without this the push 403s.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Needed for the GitHub Actions layer cache below.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<short> is what the server pins to; `latest` is a convenience
          # pointer, not a deploy target — it gives no rollback and no way to
          # tell what is actually running.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Includes org.opencontainers.image.source, which is what links the
          # package to this repo so GITHUB_TOKEN is allowed to push to it.
          labels: ${{ steps.meta.outputs.labels }}
          # Inlined into the client bundle at build time; the Dockerfile hard
          # fails when it is empty. Mirrors .env.production.example.
          build-args: |
            NEXT_PUBLIC_BATTLE_WS_URL=wss://gradientbattle.com/ws
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
