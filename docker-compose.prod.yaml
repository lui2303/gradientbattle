services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      battle:
        condition: service_healthy

  web:
    image: ghcr.io/lui2303/gradientbattle:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    command: ["pnpm", "--filter", "web", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  battle:
    image: ghcr.io/lui2303/gradientbattle:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    command: ["pnpm", "--filter", "web", "start:battle"]
    # `connections` is an in-process Map, so a second replica silently breaks
    # message delivery between players.
    scale: 1
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Runs to completion before `web` starts, so new code never serves traffic
  # against an unmigrated schema.
  migrate:
    image: ghcr.io/lui2303/gradientbattle:${TAG:-latest}
    restart: "no"
    env_file:
      - .env.production
    command: ["pnpm", "--filter", "web", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # env_file rather than `environment:` with ${...}: interpolation reads the shell
    # or a .env in the project dir, not this file, and would silently blank them out.
    env_file:
      - .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
